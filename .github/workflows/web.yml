name: Deploy web

# Despliega el Worker panter-web (Especificación §10.2): build OpenNext → wrangler deploy.
# - push a develop → staging · push a main → production · manual (workflow_dispatch).
# - GitHub Environment (staging / production):
#   secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID;
#   variable NEXT_PUBLIC_API_URL (URL de panter-api del ambiente, se incrusta en el build).
#   Si falta alguno, el job termina en verde con un aviso (ver Docs/DESPLIEGUE.md).
# El build de PR sin despliegue lo hace web-build.yml.
on:
  push:
    branches: [develop, main]
    paths:
      - 'web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente de destino (production solo desde main)
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

jobs:
  deploy:
    name: Desplegar web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
    concurrency:
      group: deploy-web-${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Comprobar ambiente y secretos
        id: secrets
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_API_URL: ${{ vars.NEXT_PUBLIC_API_URL != '' }}
        run: |
          if [ "$DEPLOY_ENV" = "production" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::production solo se despliega desde main (rama actual: ${GITHUB_REF_NAME})."
            exit 1
          fi
          missing=()
          [ "$HAS_CF_TOKEN" = "true" ] || missing+=("secreto CLOUDFLARE_API_TOKEN")
          [ "$HAS_CF_ACCOUNT" = "true" ] || missing+=("secreto CLOUDFLARE_ACCOUNT_ID")
          [ "$HAS_API_URL" = "true" ] || missing+=("variable NEXT_PUBLIC_API_URL")
          if [ ${#missing[@]} -gt 0 ]; then
            list="$(IFS=,; echo "${missing[*]}")"
            msg="Despliegue de web a ${DEPLOY_ENV} omitido: faltan ${list//,/, } en el GitHub Environment '${DEPLOY_ENV}'. Ver Docs/DESPLIEGUE.md."
            echo "::warning title=Despliegue omitido::${msg}"
            {
              echo "### ⚠️ web no se desplegó a \`${DEPLOY_ENV}\`"
              echo
              echo "${msg}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build OpenNext
        if: steps.secrets.outputs.ready == 'true'
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_ENV: ${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
        run: pnpm exec opennextjs-cloudflare build --env "$DEPLOY_ENV"

      - name: wrangler deploy
        if: steps.secrets.outputs.ready == 'true'
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # Las opciones que OpenNext no reconoce (--var) pasan tal cual a wrangler deploy.
          pnpm exec opennextjs-cloudflare deploy --env "$DEPLOY_ENV" \
            --var "APP_VERSION:${VERSION}" --var "GIT_COMMIT:${GITHUB_SHA}"
          {
            echo "### ✅ web desplegado a \`${DEPLOY_ENV}\`"
            echo
            echo "Versión \`${VERSION}\`, commit \`${GITHUB_SHA}\`, API \`${{ vars.NEXT_PUBLIC_API_URL }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
