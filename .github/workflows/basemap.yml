name: Mapa base

# Mapa base de PANTER (HU-301 y HU-302). Ver Docs/GUIA-DESPLIEGUE.md → "M2 · Mapa base".
# - Manual (workflow_dispatch): corre scripts/generar_mapa.sh, que extrae SERVICE_AREA del build
#   diario de Protomaps hasta z15, lo verifica y sube a R2 (panter-tiles-staging o panter-tiles)
#   el .pmtiles, los glifos y sprites del estilo (basemaps-assets, commit fijado) y basemap.json.
#   Secretos del GitHub Environment: CLOUDFLARE_API_TOKEN (con R2 Edit) y CLOUDFLARE_ACCOUNT_ID.
# - PR que cambie el script o este workflow: valida la extracción contra un fixture local y
#   contra una caja diminuta del build real, sin subir nada.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente de destino (production solo desde main)
        type: choice
        options: [staging, production]
        default: staging
      build_date:
        description: Fecha del build de Protomaps (AAAAMMDD). Vacío = el más reciente.
        type: string
        required: false
        default: ''
  pull_request:
    paths:
      - 'scripts/generar_mapa.sh'
      - 'scripts/fixtures/crear_mbtiles_prueba.py'
      - '.github/workflows/basemap.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validar extracción del mapa (sin subir)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: shellcheck scripts/generar_mapa.sh

      - name: Argumentos inválidos fallan con un mensaje claro
        run: |
          set -u
          for args in "--bbox 1,2,3" "--bbox 3,0,1,1" "--fecha 20261340" "--maxzoom 16" "--ambiente qa"; do
            # shellcheck disable=SC2086
            if out="$(scripts/generar_mapa.sh $args 2>&1)"; then
              echo "::error::generar_mapa.sh $args debió fallar"; exit 1
            fi
            echo "$out" | grep -q '^generar_mapa: ' || { echo "::error::sin mensaje claro: $out"; exit 1; }
          done

      - name: Extracción contra un fixture (SERVICE_AREA, con glifos y sprites)
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/fixture"
          mkdir -p "$fixture"
          python3 -I scripts/fixtures/crear_mbtiles_prueba.py "$fixture/fixture.mbtiles"
          scripts/generar_mapa.sh --fuente "$fixture/fixture.mbtiles" --fecha 20260101 \
            --maxzoom 12 --salida "$fixture/out"
          test -s "$fixture/out/panter-20260101.pmtiles"
          jq -e '.file == "panter-20260101.pmtiles" and .bounds == [-77.05,0.4,-76.3,1.3]' \
            "$fixture/out/basemap.json"
          test "$(find "$fixture/out/assets/fonts" -name '*.pbf' | wc -l)" -eq 21
          test "$(find "$fixture/out/assets/sprites/v4" -type f | wc -l)" -eq 8

      - name: Extracción de una caja diminuta del build real de Protomaps
        run: |
          # Alrededor del parque principal de Villagarzón, hasta z12: pocos KB.
          scripts/generar_mapa.sh --bbox -76.62,1.02,-76.61,1.03 --maxzoom 12 --sin-assets \
            --salida "$RUNNER_TEMP/real"

  publish:
    name: Generar y subir el mapa base a R2
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ inputs.environment }}
    concurrency:
      group: basemap-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      BUILD_DATE: ${{ inputs.build_date }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Comprobar ambiente y secretos
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$DEPLOY_ENV" = "production" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::production solo se publica desde main (rama actual: ${GITHUB_REF_NAME})."
            exit 1
          fi
          missing=()
          [ "$HAS_CF_TOKEN" = "true" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ "$HAS_CF_ACCOUNT" = "true" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Faltan los secretos ${missing[*]} en el GitHub Environment '${DEPLOY_ENV}'. Ver Docs/GUIA-DESPLIEGUE.md."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias (wrangler)
        run: pnpm install --frozen-lockfile --filter @panter/api-core...

      - name: Extraer, verificar y subir a R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          args=(--ambiente "$DEPLOY_ENV" --salida "$RUNNER_TEMP/mapa-base")
          [ -z "$BUILD_DATE" ] || args+=(--fecha "$BUILD_DATE")
          scripts/generar_mapa.sh "${args[@]}"

      - name: Resumen
        run: |
          {
            echo "### ✅ Mapa base publicado en \`${DEPLOY_ENV}\`"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/mapa-base/basemap.json"
            echo '```'
            echo
            echo "Comprobar con \`GET /tiles/basemap.json\` en panter-api del ambiente."
          } >> "$GITHUB_STEP_SUMMARY"
